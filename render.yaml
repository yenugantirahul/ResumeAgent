# render.yaml — Render Blueprint for Resume Analyzer
#
# Deploys the Express API + BullMQ Worker in ONE free web service
# (using the start-all.js process multiplexing pattern).
#
# Frontend (Next.js): Deploy separately on Vercel → https://vercel.com/new
#
# Redis: Set REDIS_URL in Render dashboard using Upstash or Redis Cloud free tier.

services:
  # ── API + Worker (combined in one free web service) ──────────────────────────
  - type: web
    name: resume-analyzer-api
    runtime: node
    region: oregon
    plan: free

    # Build from repo root so scripts/ directory is accessible
    rootDir: .

    buildCommand: >
      cd backend &&
      pnpm install --frozen-lockfile &&
      pnpm build

    # Starts both Express API and BullMQ worker using process multiplexing
    startCommand: node scripts/start-all.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "5000"

      # Supabase — set in Render dashboard
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI providers — set in Render dashboard
      - key: GROQ_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      # Clerk auth — set in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false

      - key: CLERK_SECRET_KEY
        sync: false

      # Frontend URL for CORS — set to your Vercel deployment URL
      - key: FRONTEND_URL
        sync: false

      # Redis (BullMQ) — use Upstash (https://upstash.com) or Redis Cloud free tier
      - key: REDIS_URL
        sync: false