# render.yaml — Render Blueprint for Resume Analyzer API
#
# This file deploys the Express.js backend to Render's free tier.
#
# Frontend (Next.js): Deploy separately on Vercel → https://vercel.com/new
# AI Background Tasks (Trigger.dev): Deploy with:
#   cd backend && npx trigger.dev@latest deploy
#
# Setup:
#   1. Connect GitHub repo to Render
#   2. Render will auto-detect this file and create the service
#   3. Set all "sync: false" env vars manually in the Render dashboard
#   4. Deploy the frontend on Vercel and set NEXT_PUBLIC_BASE_URL to the Render API URL

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: resume-analyzer-api
    runtime: node
    region: oregon
    plan: free

    # Build from the backend subdirectory
    rootDir: backend

    # Install deps and compile TypeScript
    buildCommand: pnpm install --frozen-lockfile && pnpm build

    # Start the compiled server
    startCommand: node dist/server.js

    # Render uses this to verify the service is healthy
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "5000"

      # Supabase — set in Render dashboard
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI providers — set in Render dashboard
      - key: GROQ_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      # Clerk auth — set in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false

      - key: CLERK_SECRET_KEY
        sync: false

      # Frontend URL for CORS — set to your Vercel deployment URL
      - key: FRONTEND_URL
        sync: false

      # Trigger.dev — set in Render dashboard (get from trigger.dev dashboard)
      - key: TRIGGER_SECRET_KEY
        sync: false
